services:
  - type: web
    name: ethio-tele-trade-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: DATABASE_URL
        value: sqlite:///data.db
      - key: LOG_CHANNEL_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
